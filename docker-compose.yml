services:
  app-tokoman:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tokoman_app
    restart: unless-stopped
    working_dir: /var/www/tokoman
    env_file:
      - ./.env
    volumes:
      - .:/var/www/tokoman
    networks:
      - shared-network
    depends_on:
      - db-mysql
  
  web-minilemon:
    image: nginx:alpine
    container_name: minilemon_web
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=tokoman.self.web.id
      - LETSENCRYPT_HOST=tokoman.self.web.id
    volumes:
      - .:/var/www/tokoman
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shared-network
    depends_on:
      - app-tokoman

networks:
  shared-network:
    external: true