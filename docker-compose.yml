services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GIT_HASH=${GIT_HASH}
    restart: unless-stopped
    working_dir: /var/www/tokoman
    env_file:
      - ./.env
    volumes:
      - app_vol:/var/www/tokoman
      - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - shared-network
  
  web:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=kontol.self.web.id
      - LETSENCRYPT_HOST=kontol.self.web.id
      - LETSENCRYPT_EMAIL=ahmadfauzanroziqin@gmail.com
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - app_vol:/var/www/tokoman
    networks:
      - shared-network
    depends_on:
      - app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GIT_HASH=${GIT_HASH}
    restart: unless-stopped
    command: /usr/bin/supervisord
    env_file:
      - ./.env
    volumes:
      - app_vol:/var/www/tokoman
    networks:
      - shared-network
    depends_on:
      - app

networks:
  shared-network:
    external: true

volumes:
  app_vol:
    name: ${COMPOSE_PROJECT_NAME}_app_vol
